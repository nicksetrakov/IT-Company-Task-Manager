{% extends "layouts/base.html" %}

{% block content %}
  <h1>Delete {% block obj_name %} {% endblock %}?</h1>
  <form action="" method="post">
    {% csrf_token %}

    <input type="submit" value="Yes" class="btn bg-gradient-danger">
    <a href="{{ request.META.HTTP_REFERER }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
